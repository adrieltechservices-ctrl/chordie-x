name: Build and Release Desktop App

on:
  push:
    tags:
      - 'v*' # Triggers automatically whenever you push a version tag like v1.0.0

jobs:
  release:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    # EXPLICIT PERMISSIONS: Tells GitHub to allow the workflow to write to Releases
    permissions:
      contents: write

    strategy:
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm install

      - name: Build Web Production Assets
        run: npm run build

      - name: Compile and Build Native Software Installers
        uses: samuelmeuli/action-electron-builder@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release: true
